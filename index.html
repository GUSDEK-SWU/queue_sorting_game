<title>จัดคิวให้ทัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500;700&display=swap">
<style>
/* Layout concept: ป้ายคิวอิเล็กทรอนิกส์สีดำ-อำพันอยู่บนสุด ด้านล่างเป็นเคาน์เตอร์ที่ลูกค้าถือบัตรคิวกระดาษ
   บัตรแต่ละใบบอก "รอได้กี่นาที" เป็นตัวเลขใหญ่ ผู้เล่นเรียงจากน้อยไปมาก */
:root{
  --bg:#E3EAE6; --surface:#F6F9F7; --surface-2:#E9EFEC; --lane:#D8E1DC;
  --ink:#14201B; --muted:#52625A; --line:#BFCBC5;
  --ticket:#FFFFFF; --ticket-edge:#CBD6D0;
  --accent:#C94320; --accent-ink:#FFFFFF;
  --ok:#0B7A63; --ok-soft:#CFEBE3; --bad:#B42318; --bad-soft:#FBDAD5; --focus:#1D4ED8;
  --board-bg:#0E1411; --board-fg:#FFB020; --board-dim:#4A3A14; --board-label:#9AA89F;
  --f-display:'Kanit','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1210; --surface:#16201C; --surface-2:#1F2C27; --lane:#0F1714;
    --ink:#E6EEEA; --muted:#9DB0A7; --line:#2C3B35;
    --ticket:#202D28; --ticket-edge:#36463F;
    --accent:#FF7A50; --accent-ink:#1A0E09;
    --ok:#3FD0A8; --ok-soft:#12382F; --bad:#FF8A7A; --bad-soft:#3E1B17; --focus:#7AA2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#16201C; --surface-2:#1F2C27; --lane:#0F1714;
  --ink:#E6EEEA; --muted:#9DB0A7; --line:#2C3B35;
  --ticket:#202D28; --ticket-edge:#36463F;
  --accent:#FF7A50; --accent-ink:#1A0E09;
  --ok:#3FD0A8; --ok-soft:#12382F; --bad:#FF8A7A; --bad-soft:#3E1B17; --focus:#7AA2FF;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- ส่วนหัว ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:32px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);font-size:14px}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:transparent}
.steps .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font:600 12px var(--f-mono);color:var(--ink)}
.steps li.cur{border-color:var(--accent);color:var(--ink);background:var(--surface)}
.steps li.cur .n{background:var(--accent);color:var(--accent-ink)}
.steps .st{color:var(--accent);letter-spacing:.05em;font-size:12px}

/* ---------- ป้ายคิว (ชุดสีเดียวทั้งสองธีม) ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#26302B;border-radius:12px;overflow:hidden;border:1px solid #26302B}
.board .cell{background:var(--board-bg);padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.board .k{font-size:12px;color:var(--board-label);letter-spacing:.06em}
.board .v{font:600 30px/1 var(--f-mono);color:var(--board-fg);text-shadow:0 0 12px rgba(255,176,32,.35);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:8px;height:30px;align-items:center}
.pips i{width:26px;height:14px;border-radius:3px;background:var(--board-dim)}
.pips i.on{background:var(--board-fg);box-shadow:0 0 10px rgba(255,176,32,.5)}

/* ---------- แผงหลัก ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;flex-direction:column;gap:6px}
.phead h2{font-size:22px;font-weight:700}
.lead{max-width:65ch;color:var(--muted)}
.lead b{color:var(--ink);font-weight:600}
.cap{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:-8px}
.lane{display:flex;flex-wrap:wrap;gap:10px;padding:14px;min-height:92px;background:var(--lane);border-radius:10px;align-items:flex-start}
.lane:empty::before{content:attr(data-empty);color:var(--muted);font-size:13px;align-self:center}
.incoming{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.incoming .k{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-right:4px}

/* ---------- บัตรคิว ---------- */
.ticket{display:flex;flex-direction:column;gap:2px;width:104px;min-height:126px;padding:8px 9px 10px;text-align:left;color:var(--ink);
  background-color:var(--ticket);border:1px solid var(--ticket-edge);border-radius:6px;position:relative;flex:0 0 auto;
  background-image:radial-gradient(circle at 0 31px,var(--lane) 6px,transparent 6.5px),radial-gradient(circle at 100% 31px,var(--lane) 6px,transparent 6.5px)}
.t-no{font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;color:var(--muted);padding-bottom:9px;border-bottom:1px dashed var(--ticket-edge);margin-bottom:4px;display:block}
.t-name{font-weight:600;font-size:15px;line-height:1.25;display:block}
.t-order{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.t-wait{margin-top:auto;display:flex;align-items:baseline;gap:4px;padding-top:6px}
.t-wait b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.t-wait small{font-size:12px;color:var(--muted)}
.t-bar{display:block;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.t-bar i{display:block;height:100%;background:var(--accent)}
.ticket.sm{width:84px;min-height:0;padding:6px 8px 8px;background-image:none}
.sm .t-no,.sm .t-order{display:none}
.sm .t-name{font-size:13px}
.sm .t-wait b{font-size:22px}
.ticket.dim{opacity:.62}
.ticket.ghost{width:78px;min-height:0;padding:6px 8px;background-image:none;border-style:dashed;opacity:.8}
.ghost .t-name{font-size:13px}
.ghost .t-wait b{font-size:20px;color:var(--muted)}
.ticket.cur{outline:3px solid var(--accent);outline-offset:1px;transform:translateY(-6px);box-shadow:0 10px 18px -8px rgba(0,0,0,.45)}
.ticket.cmp{outline:2px dashed var(--muted);outline-offset:1px}
.ticket.ok{border-color:var(--ok)}
button.ticket{cursor:pointer;font:inherit;transition:transform .12s,box-shadow .12s}
button.ticket:hover:not([disabled]){transform:translateY(-4px);box-shadow:0 10px 18px -8px rgba(0,0,0,.45)}
button.ticket[disabled]{cursor:default}
button.ticket.front{outline:2px solid var(--accent);outline-offset:1px}
.from-r{animation:fromr .28s ease-out}
.from-l{animation:froml .28s ease-out}
.pop{animation:pop .28s ease-out}
@keyframes fromr{from{transform:translateX(114px)}}
@keyframes froml{from{transform:translateX(-114px)}}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.92)}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- ปุ่ม ---------- */
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.btn{cursor:pointer;border-radius:10px;border:2px solid transparent;padding:12px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);background:var(--surface-2);min-width:0}
.btn strong{font-family:var(--f-display);font-weight:500;font-size:18px}
.btn span{font-size:13px;opacity:.9}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.stay{background:var(--ok-soft);border-color:var(--ok)}
.btn.plain{background:transparent;border-color:var(--line)}
.btn.hinted{box-shadow:0 0 0 3px var(--focus)}
.btn:hover{filter:brightness(1.06)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.inline{flex-direction:row;align-items:center;gap:8px;padding:10px 14px}

/* ---------- ด่านรวมแถว ---------- */
.vs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:15px}
.vs b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.vs .x{color:var(--muted);font-size:13px}
.mergebox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mergebox .full{grid-column:1/-1}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mcol h3{font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.mcol h3 span{color:var(--muted);font-size:12px;font-family:var(--f-body)}
@media (max-width:640px){.mergebox{grid-template-columns:1fr}}

.sg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chip{display:grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:5px;background:var(--ticket);border:1px solid var(--ticket-edge);font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.sg.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sg.used{opacity:.45}
.groups{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.groups .k{font-size:12px;color:var(--muted);min-width:64px}
.split{display:flex;flex-direction:column;gap:10px;overflow-x:auto;padding:14px;background:var(--lane);border-radius:10px}
.srow{display:flex;gap:8px;align-items:center}
.srow .k{font-size:12px;color:var(--muted);width:78px;flex:0 0 78px}
.srow .gs{display:flex;gap:8px;flex-wrap:nowrap}

/* ---------- ข้อความ ---------- */
.notice{padding:16px;border-radius:10px;border:1px solid var(--ok);background:var(--ok-soft);display:flex;flex-direction:column;gap:10px}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.notice h3{font-size:18px}
.notice p{max-width:65ch}
.stars{font-size:22px;letter-spacing:.08em;color:var(--accent)}
details.how{border-top:1px solid var(--line);padding-top:12px;font-size:14px}
details.how summary{cursor:pointer;font-weight:500}
details.how p{margin-top:8px;max-width:65ch;color:var(--muted)}
details.how p b{color:var(--ink);font-weight:600}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.log li{color:var(--muted)}
.log li.ok{color:var(--ok)}
.log li.bad{color:var(--bad)}
.log li:first-child{font-weight:500}
.logwrap{padding:0 4px}
.logwrap h3{font-size:12px;font-family:var(--f-body);font-weight:500;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0}
.rules div{padding:12px 14px;background:var(--surface-2);border-radius:10px}
.rules dt{font-family:var(--f-display);font-weight:500;margin-bottom:2px}
.rules dd{margin:0;font-size:14px;color:var(--muted)}
.intro-demo{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.res>div{padding:14px;background:var(--surface-2);border-radius:10px;display:flex;flex-direction:column;gap:4px}
.res .big{font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.res .k{font-size:13px;color:var(--muted)}

@media (max-width:480px){
  .top h1{font-size:28px}
  .board .v{font-size:24px}
  .board .cell{padding:10px 12px}
  .pips i{width:18px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app" id="app"></div>

<script>
/* =====================================================================
   ส่วนที่ 1: SORTING ALGORITHM (หัวใจของเกม)
   ฟังก์ชันในส่วนนี้เป็นตรรกะล้วน ไม่แตะ DOM
   ค่าที่ใช้เรียง = c.p  คือ "รอได้กี่นาที"  เรียงจากน้อยไปมาก
   (คนที่รอได้น้อยที่สุดคือคนที่ต้องได้ก่อน อยู่หน้าแถว)
   ===================================================================== */
// ===SORT-START===

/* ---------------------------------------------------------------------
   อัลกอริทึมที่ 1: INSERTION SORT  (ด่าน 1)
   แนวคิด: แถวด้านหน้า "เรียงแล้ว" เสมอ ลูกค้าคนใหม่เดินมาต่อท้าย
   แล้วแทรกถอยไปข้างหน้าทีละช่อง โดยเทียบกับคนที่อยู่ข้างหน้า
     - ถ้าคนข้างหน้ารอได้มากกว่า -> สลับที่กัน (ขยับขึ้นหน้า) แล้วเทียบต่อ
     - ถ้าคนข้างหน้ารอได้น้อยกว่า หรือถึงหน้าแถวแล้ว -> หยุด คนนี้ได้ที่แล้ว
   ในเกม ผู้เล่นเป็นคนตัดสินใจแต่ละครั้ง ส่วนฟังก์ชันด้านล่างตรวจว่าถูกหรือผิด
   --------------------------------------------------------------------- */

// line = แถวปัจจุบัน, idx = ตำแหน่งของคนที่กำลังแทรก
// คืนค่า true ถ้าต้องสลับกับคนข้างหน้า (คนข้างหน้ารอได้มากกว่า)
function insertionShouldMove(line, idx) {
  return idx > 0 && line[idx - 1].p > line[idx].p;
}

// เตรียมสถานะเริ่มต้น: คนแรกถือว่าเรียงแล้ว คนที่สองเดินเข้ามาเป็นคนที่กำลังแทรก
function insertionInit(list) {
  const s = { line: [list[0]], idx: 0, arrivals: list.slice(1), comps: 0, swaps: 0, done: false };
  insertionNext(s);
  return s;
}

// คนปัจจุบันได้ที่แล้ว -> ให้คนถัดไปเดินเข้าแถว (ถ้าไม่มีแล้วคือเรียงเสร็จ)
function insertionNext(s) {
  if (s.arrivals.length === 0) { s.done = true; s.idx = -1; return; }
  s.line.push(s.arrivals.shift());
  s.idx = s.line.length - 1;
}

// action = 'move' (สลับกับคนข้างหน้า) หรือ 'stay' (หยุดตรงนี้)
// ถูกต้อง -> ทำตามนั้นและนับการเทียบ 1 ครั้ง / ผิด -> ไม่เปลี่ยนแถว
function insertionStep(s, action) {
  const should = insertionShouldMove(s.line, s.idx);
  if (action === 'move') {
    if (!should) return { ok: false };
    const j = s.idx;
    const t = s.line[j - 1]; s.line[j - 1] = s.line[j]; s.line[j] = t; // สลับ
    s.idx--; s.comps++; s.swaps++;
    const reachedFront = s.idx === 0;
    if (reachedFront) insertionNext(s);  // ถึงหน้าแถว ไม่ต้องเทียบแล้ว
    return { ok: true, moved: true, reachedFront };
  }
  if (should) return { ok: false };
  s.comps++;                              // เทียบแล้วพบว่าอยู่ถูกที่
  insertionNext(s);
  return { ok: true, moved: false };
}

// ใช้นับจำนวนครั้งที่ Insertion Sort ต้องเทียบ/สลับกับข้อมูลชุดเดียวกัน (เพื่อเทียบกับ Merge ในหน้าสรุป)
function insertionSortCount(list) {
  const a = list.map(function (c) { return c.p; });
  let comps = 0, swaps = 0;
  for (let i = 1; i < a.length; i++) {
    let j = i;
    while (j > 0) {
      comps++;
      if (a[j - 1] > a[j]) { const t = a[j - 1]; a[j - 1] = a[j]; a[j] = t; swaps++; j--; }
      else break;
    }
  }
  return { comps: comps, swaps: swaps };
}

/* ---------------------------------------------------------------------
   อัลกอริทึมที่ 2: MERGE SORT  (ด่าน 2 และ 3)
   แนวคิด: "แบ่งครึ่งจนเหลือคนเดียว แล้วรวมกลับทีละคู่"
   หัวใจคือขั้น MERGE: มีสองแถวที่เรียงแล้ว ดูแค่คนหน้าสุดของแต่ละแถว
   หยิบคนที่รอได้น้อยกว่าไปต่อแถวใหม่ ทำซ้ำจนหมด
   --------------------------------------------------------------------- */

// สร้างสถานะการรวมแถว A กับ B (ทั้งสองต้องเรียงแล้ว)
function mergeInit(A, B) {
  return { A: A.slice(), B: B.slice(), out: [], comps: 0, done: false, copied: 0 };
}

// ตอบว่าควรหยิบจากแถวไหน: คนหน้าสุดที่รอได้น้อยกว่าไปก่อน
function mergeRight(m) {
  return m.A[0].p < m.B[0].p ? 'A' : 'B';
}

// ผู้เล่นเลือกหยิบคนหน้าสุดของแถว side ('A' หรือ 'B')
function mergePick(m, side) {
  if (m.done || m[side].length === 0) return { ok: false, right: null };
  if (m.A.length > 0 && m.B.length > 0) {
    const right = mergeRight(m);
    if (side !== right) return { ok: false, right: right };  // เลือกผิด
    m.comps++;                                               // เทียบกัน 1 ครั้ง
  }
  m.out.push(m[side].shift());
  // ถ้าเหลือแถวเดียว คนที่เหลือเรียงแล้ว ต่อท้ายได้ทั้งแถวโดยไม่ต้องเทียบ
  if (m.A.length === 0 || m.B.length === 0) {
    const rest = m.A.length > 0 ? m.A : m.B;
    m.copied = rest.length;
    while (rest.length > 0) m.out.push(rest.shift());
    m.done = true;
  }
  return { ok: true };
}

// Merge Sort ครบวงจรแบบล่างขึ้นบน (ด่าน 3):
// เริ่มจากแถวละ 1 คน รวมเป็นแถวละ 2, 4, 8 ตามลำดับ
function planInit(list) {
  const P = { runs: list.map(function (c) { return [c]; }), pass: 1, t: 0, results: [], m: null, done: false, comps: 0, final: null };
  planAdvance(P);
  return P;
}

// หาคู่แถวถัดไปที่ต้องรวม / ขึ้นรอบใหม่เมื่อรวมครบทุกคู่ในรอบนี้
function planAdvance(P) {
  for (;;) {
    const i = P.t * 2;
    if (i >= P.runs.length) {                 // จบรอบ -> ผลลัพธ์ของรอบนี้คือแถวของรอบหน้า
      P.runs = P.results; P.results = []; P.t = 0; P.pass++;
      if (P.runs.length <= 1) { P.done = true; P.m = null; P.final = P.runs[0] || []; return; }
      continue;
    }
    if (i + 1 >= P.runs.length) {             // เหลือแถวเดี่ยว ยกไปรอบหน้าเลย
      P.results.push(P.runs[i]); P.t++; continue;
    }
    P.m = mergeInit(P.runs[i], P.runs[i + 1]);
    return;
  }
}

// เมื่อรวมคู่หนึ่งเสร็จ (m.done) ให้เก็บผลแล้วไปคู่ถัดไป
function planFinishTask(P) {
  P.comps += P.m.comps;
  P.results.push(P.m.out);
  P.t++;
  planAdvance(P);
}

// จำนวนรอบทั้งหมดของ Merge Sort = ceil(log2 n)
function planTotalPasses(n) {
  let k = 0, s = 1;
  while (s < n) { s *= 2; k++; }
  return k;
}

// นับจำนวนครั้งที่ต้องเทียบของ Merge Sort (ใช้เทียบกับ Insertion ในหน้าสรุป)
function mergeSortCount(list) {
  let comps = 0;
  function ms(a) {
    if (a.length <= 1) return a;
    const mid = a.length >> 1;
    const l = ms(a.slice(0, mid)), r = ms(a.slice(mid));
    const out = []; let i = 0, j = 0;
    while (i < l.length && j < r.length) {
      comps++;
      if (l[i] < r[j]) out.push(l[i++]); else out.push(r[j++]);
    }
    return out.concat(l.slice(i), r.slice(j));
  }
  ms(list.map(function (c) { return c.p; }));
  return comps;
}

// ===SORT-END===

/* =====================================================================
   ส่วนที่ 2: สร้างข้อมูลลูกค้าแบบสุ่ม
   ===================================================================== */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function inversions(list) {
  let n = 0;
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) if (list[i].p > list[j].p) n++;
  return n;
}
function byP(a, b) { return a.p - b.p; }
const NAMES = ['น้องมีน','พี่บอส','ป้าแดง','ลุงชัย','คุณฟ้า','เอ็ม','อ้อม','ต้น','เบล','ปอ','ฝน','ภูมิ','แนน','โอ๊ต'];
const ORDERS = ['ชาไทยเย็น','ข้าวมันไก่','กาแฟเย็น','ก๋วยเตี๋ยวเรือ','ผัดกะเพรา','น้ำมะนาวปั่น','ข้าวหมูแดง','โรตีกล้วย','ส้มตำไทย','โจ๊กหมู','ชานมไข่มุก','ข้าวไข่เจียว','ขนมปังนมสด','สลัดผัก'];
// ค่า "รอได้กี่นาที" ไม่ซ้ำกัน อยู่ระหว่าง 2-16 นาที
function pickValues(n) {
  const pool = []; for (let v = 2; v <= 16; v++) pool.push(v);
  return shuffle(pool).slice(0, n);
}
function makeCustomers(values) {
  const names = shuffle(NAMES.slice()), orders = shuffle(ORDERS.slice());
  return values.map(function (p, i) { return { no: i + 1, p: p, name: names[i], order: orders[i] }; });
}
function genL1() {
  let list, g = 0;
  do { list = makeCustomers(pickValues(6)); g++; } while (!(inversions(list) >= 6 && inversions(list) <= 11) && g < 500);
  return list;
}
function genL2() {
  let A, B, g = 0;
  do {
    const list = makeCustomers(pickValues(8));
    const idx = shuffle([0,1,2,3,4,5,6,7]);
    A = idx.slice(0, 4).map(function (i) { return list[i]; }).sort(byP);
    B = idx.slice(4).map(function (i) { return list[i]; }).sort(byP);
    g++;
  } while (mergeCompsOf(A, B) < 5 && g < 500);
  return { A: A, B: B };
}
function mergeCompsOf(A, B) {
  const m = mergeInit(A, B);
  while (!m.done) mergePick(m, mergeRight(m));
  return m.comps;
}
function genL3() {
  let list, g = 0;
  do { list = makeCustomers(pickValues(8)); g++; }
  while (!(inversions(list) >= 12 && insertionSortCount(list).comps >= mergeSortCount(list) + 3) && g < 2000);
  return list;
}

    }
    return vs + '<div class="mergebox">' +
      '<div class="mcol"><h3>เคาน์เตอร์ A<span>เรียงแล้ว</span></h3><div class="lane" data-empty="ว่าง">' + lane(m.A, 'A') + '</div></div>' +
      '<div class="mcol"><h3>เคาน์เตอร์ B<span>เรียงแล้ว</span></h3><div class="lane" data-empty="ว่าง">' + lane(m.B, 'B') + '</div></div>' +
      '<div class="mcol full"><h3>แถวรวม<span>หน้าแถว → ท้ายแถว</span></h3><div class="lane" data-empty="ยังไม่มีใครในแถวรวม">' + out + '</div></div></div>' +
      (m.done ? '' : '<span class="lead" style="font-size:13px">คีย์ลัด: ← เลือก A · → เลือก B</span>');
  }

  function l2HTML() {
    const m = G.m2;
    const done = G.levelDone ? doneNotice('เทียบกัน ' + m.comps + ' ครั้ง ด่านถัดไปใช้ Merge นี้ซ้ำหลายรอบเพื่อเรียงแถวที่ยังไม่เรียงเลย', 'next', 'ไปด่าน 3') : '';
    return '<section class="panel' + (G.shake ? ' shake' : '') + '"><div class="phead"><h2>ด่าน 2 · Merge</h2>' +
      '<p class="lead">ทั้งสองเคาน์เตอร์เรียงแถวของตัวเองแล้ว เทียบเฉพาะ<b>คนหน้าสุด</b>ของแต่ละเคาน์เตอร์ คลิกคนที่รอได้น้อยกว่าให้ไปต่อแถวรวม</p></div>' +
      mergeAreaHTML(m, G.lock) +
      (G.levelDone ? done : '<div class="row"><button type="button" class="btn plain inline" data-action="hint"><span>' + (G.hint ? 'ซ่อนคำใบ้' : 'ขอคำใบ้') + '</span></button>' +
        (G.hint ? '<span class="lead">คำใบ้: ให้เลือกเคาน์เตอร์ ' + mergeRight(m) + '</span>' : '') + '</div>') +
      '<details class="how"><summary>Merge ในเกมนี้ทำงานอย่างไร</summary><p><b>สองแถวที่เรียงแล้ว</b> ไม่ต้องดูทุกคน ดูแค่คนหน้าสุดของแต่ละแถว หยิบคนที่รอได้น้อยกว่าไปต่อแถวใหม่ ทำซ้ำจนเหลือแถวเดียว ส่วนที่เหลือเรียงอยู่แล้วต่อท้ายได้เลย</p></details></section>';
  }

  function l3HTML() {
    const P = G.p3;
    if (G.phase3 === 'split') {
      const L = G.list3;
      const rows = [8, 4, 2, 1].map(function (size) {
        let gs = '';
        for (let i = 0; i < L.length; i += size) gs += '<span class="sg">' + chips(L.slice(i, i + size)) + '</span>';
        return '<div class="srow"><span class="k">แถวละ ' + size + ' คน</span><div class="gs">' + gs + '</div></div>';
      }).join('');
      return '<section class="panel"><div class="phead"><h2>ด่าน 3 · Merge Sort เต็มรูปแบบ</h2>' +
        '<p class="lead">แถว 8 คนนี้ยังไม่เรียงเลย Merge Sort <b>แบ่งครึ่งซ้ำ</b>จนเหลือแถวละ 1 คน แถวที่มีคนเดียวถือว่าเรียงแล้วโดยอัตโนมัติ จากนั้นรวมกลับทีละคู่ด้วย Merge แบบด่าน 2 ตัวเลขในช่องคือจำนวนนาทีที่รอได้</p></div>' +
        '<div class="split">' + rows + '</div>' +
        '<div class="row"><button type="button" class="btn go inline" data-action="beginmerge"><strong>เริ่มรวมแถว</strong></button></div></section>';
    }
    const total = planTotalPasses(G.list3.length);
    let body = '';
    if (!G.levelDone) {
      const runsHtml = P.runs.map(function (r, i) {
        const cls = (i === P.t * 2 || i === P.t * 2 + 1) ? 'cur' : (i < P.t * 2 ? 'used' : '');
        return '<span class="sg ' + cls + '">' + chips(r) + '</span>';
      }).join('');
      const resHtml = P.results.map(function (r) { return '<span class="sg">' + chips(r) + '</span>'; }).join('');
      body = '<div class="groups"><span class="k">ก่อนรวม</span>' + runsHtml + '</div>' +
        '<div class="groups"><span class="k">รวมแล้ว</span>' + (resHtml || '<span class="lead" style="font-size:13px">ยังไม่มี</span>') + '</div>' +
        mergeAreaHTML(P.m, G.lock) +
        '<div class="row"><button type="button" class="btn plain inline" data-action="hint"><span>' + (G.hint ? 'ซ่อนคำใบ้' : 'ขอคำใบ้') + '</span></button>' +
        (G.hint && !P.m.done ? '<span class="lead">คำใบ้: ให้เลือกเคาน์เตอร์ ' + mergeRight(P.m) + '</span>' : '') + '</div>';
    } else {
      const f = G.facts.l3;
      body = '<div class="lane" data-empty="">' + P.final.map(function (c) { return ticket(c, { cls: 'sm ok' }); }).join('') + '</div>' +
        doneNotice('คุณรวมแถวเทียบกัน ' + f.merge + ' ครั้ง ถ้าใช้ Insertion Sort กับแถวเดียวกันนี้ต้องเทียบ ' + f.ins + ' ครั้ง', 'result', 'ดูสรุป');
    }
    const pass = Math.min(P.pass, total);
    return '<section class="panel' + (G.shake ? ' shake' : '') + '"><div class="phead"><h2>ด่าน 3 · Merge Sort เต็มรูปแบบ</h2>' +
      '<p class="lead">' + (G.levelDone ? 'แถวเรียงครบแล้ว' : 'รอบที่ <b>' + pass + '</b> จาก ' + total + ' · รวมแถวละ ' + Math.pow(2, pass - 1) + ' คน เป็นแถวละ ' + Math.pow(2, pass) + ' คน คู่ที่ ' + Math.min(P.t + 1, Math.ceil(P.runs.length / 2)) + ' จาก ' + Math.ceil(P.runs.length / 2)) + '</p></div>' +
      body +
      '<details class="how"><summary>Merge Sort ในเกมนี้ทำงานอย่างไร</summary><p><b>แบ่งแล้วรวม</b> แบ่งแถวครึ่งหนึ่งซ้ำๆ จนเหลือคนเดียว แล้วรวมแถวที่เรียงแล้วทีละคู่ (ขั้น Merge เหมือนด่าน 2) รวมกันสามรอบก็ได้แถว 8 คนที่เรียงสมบูรณ์</p></details></section>';
  }

  function resultHTML() {
    const total = G.stars[0] + G.stars[1] + G.stars[2];
    const f1 = G.facts.l1 || { comps: 0, swaps: 0 }, f3 = G.facts.l3 || { merge: 0, ins: 0 };
    return '<section class="panel"><div class="phead"><h2>ปิดร้านแล้ว คิวเรียบร้อย</h2>' +
      '<p class="lead">ดาวรวม <b>' + total + ' จาก 9</b></p></div>' +
      '<div class="res">' +
      '<div><span class="k">ด่าน 1 · Insertion Sort</span><span class="big">' + starsText(G.stars[0]) + '</span><span class="k">เทียบ ' + f1.comps + ' ครั้ง สลับ ' + f1.swaps + ' ครั้ง</span></div>' +
      '<div><span class="k">ด่าน 2 · Merge</span><span class="big">' + starsText(G.stars[1]) + '</span><span class="k">เทียบ ' + (G.facts.l2 ? G.facts.l2.comps : 0) + ' ครั้ง</span></div>' +
      '<div><span class="k">ด่าน 3 · Merge Sort</span><span class="big">' + starsText(G.stars[2]) + '</span><span class="k">เทียบ ' + f3.merge + ' ครั้ง</span></div></div>' +
      '<div class="notice"><h3>แถวเดียวกัน สองวิธี</h3>' +
      '<p>ด่าน 3 ใช้ Merge Sort เทียบ ' + f3.merge + ' ครั้ง ถ้าใช้ Insertion Sort จะเทียบ ' + f3.ins + ' ครั้ง ส่วนต่างยังดูไม่มากเพราะมีแค่ 8 คน แต่ถ้าคิวยาว 1,000 คน Insertion Sort เฉลี่ยราว 250,000 ครั้ง ส่วน Merge Sort ราว 10,000 ครั้ง</p>' +
      '<p>Insertion Sort เหมาะกับคิวที่คนเดินเข้ามาทีละคนหรือแถวที่เกือบเรียงแล้ว Merge Sort เหมาะกับข้อมูลก้อนใหญ่ที่ยังไม่เรียง</p></div>' +
      '<div class="row"><button type="button" class="btn go inline" data-action="restart"><strong>เล่นอีกรอบ</strong></button></div></section>';
  }

  function logHTML() {
    if (G.screen !== 'play' || !G.log.length) return '';
    return '<div class="logwrap"><h3>บันทึกพนักงาน</h3><ul class="log" aria-live="polite">' +
      G.log.map(function (l) { return '<li class="' + l.k + '">' + (l.k === 'ok' ? '✓ ' : l.k === 'bad' ? '✗ ' : '') + l.t + '</li>'; }).join('') + '</ul></div>';
  }

  function render() {
    const f = document.activeElement;
    const key = f && f.dataset && f.dataset.action ? f.dataset.action + '|' + (f.dataset.side || '') : null;
    let main;
    if (G.screen === 'intro') main = introHTML();
    else if (G.screen === 'result') main = resultHTML();
    else if (G.over) main = overHTML();
    else if (G.level === 1) main = l1HTML();
    else if (G.level === 2) main = l2HTML();
    else main = l3HTML();
    app.innerHTML = headerHTML() + boardHTML() + main + logHTML();
    G.fx = {}; G.shake = false;
    if (key) {
      const p = key.split('|');
      const el = app.querySelector('[data-action="' + p[0] + '"][data-side="' + p[1] + '"]') || (p[1] === '' ? app.querySelector('[data-action="' + p[0] + '"]') : null);
      if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { /* ไม่เป็นไร */ } }
    }
  }

  app.addEventListener('click', function (e) {
    const t = e.target.closest('[data-action]');
    if (!t || G.lock || t.disabled) return;
    act(t.dataset.action, t.dataset.side);
  });
  document.addEventListener('keydown', function (e) {
    if (G.screen !== 'play' || G.over || G.lock || G.levelDone) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (G.level === 1) { e.preventDefault(); act(e.key === 'ArrowLeft' ? 'move' : 'stay'); }
    else if (G.level === 2 || (G.level === 3 && G.phase3 === 'merge')) { e.preventDefault(); act('pick', e.key === 'ArrowLeft' ? 'A' : 'B'); }
  });

  render();
})();
</script>
